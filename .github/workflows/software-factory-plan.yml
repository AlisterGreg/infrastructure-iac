name: Software Factory Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - "software-factory/**"
      - ".github/workflows/software-factory-*.yml"

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: software-factory-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Software Factory Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software-factory
    env:
      TF_VAR_github_app_id: ${{ vars.SF_GITHUB_APP_ID }}
      TF_VAR_factory_key: ${{ secrets.SF_FACTORY_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests
        run: node --test software-factory/test/*.test.mjs

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.0
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -no-color -recursive

      - name: Initialise Terraform
        run: terraform init -input=false

      - name: Validate Terraform
        run: terraform validate -no-color

      - name: Plan Terraform
        run: terraform plan -input=false -no-color -out=tfplan
